name: Docker

# Triggers: a version tag (the same event that creates the GitHub release) or a
# manual run. Never a branch push — a mutable `latest` must not move on every
# commit, and :latest is what the 1Panel deployment pulls.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN is the only credential: `packages: write` lets that built-in token
# push to GHCR, so this workflow needs no repository secrets (same policy as
# release.yml, so it also runs on a fork with default settings).
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a half-finished multi-arch push: it would leave the tag pointing
  # at a manifest whose arm64 entry is missing.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vpertj/farwork

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The server's architecture is unknown, so ship both. arm64 is emulated
      # through QEMU: correct, but the slow half of this job.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces exactly the three tags this deployment needs:
      #   latest        what 1Panel pulls
      #   <git tag>     e.g. v0.1.0, the immutable name of the release
      #   sha-<short>   e.g. sha-1a2b3c4, the commit that was built
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-level cache only: no extra service to run, and a rebuild of
          # the unchanged Rust layer is what makes re-tagging affordable.
          cache-from: type=gha
          cache-to: type=gha,mode=max
