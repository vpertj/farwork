[package]
name = "farwork-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Farwork hub: multi-user API server (Postgres) replacing the upstream Python server"

[dependencies]
anyhow.workspace = true
farwork-timeline.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# `fs` adds ServeDir/ServeFile, used only when FARWORK_HUB_STATIC_DIR is set
# (src/static_site.rs). Enabled per crate so the other binaries stay lean.
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

