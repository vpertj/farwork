[workspace]
resolver = "2"
members = ["crates/farwork-protocol", "crates/farwork-server", "crates/farwork-connector"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
farwork-protocol = { path = "crates/farwork-protocol" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
